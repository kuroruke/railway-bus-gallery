<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鉄道・バス車両図鑑</title>
<style>
body{margin:0;background:#f4f5f7;color:#222;font-family:system-ui,sans-serif}
header{background:#173451;color:white;padding:24px 16px}
main{max-width:960px;margin:auto;padding:20px 16px}
h1{font-size:1.6rem;margin:0 0 8px}
.search{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:10px;font-size:1rem}
.note{color:#555;line-height:1.8}
.card{background:white;border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 2px 8px #0001}
footer{text-align:center;padding:28px;color:#666;font-size:.85rem}
</style>
</head>
<body>
<header><h1>鉄道・バス車両図鑑</h1><div>写真で探す、車両の記録。</div></header>
<main>
<input class="search" placeholder="編成番号・車両番号で検索（準備中）" disabled>
<section class="card"><h2>鉄道車両</h2><p class="note">編成番号ごとに写真をまとめて掲載します。</p></section>
<section class="card"><h2>バス車両</h2><p class="note">車両番号ごとに写真や塗装変更の記録をまとめます。</p></section>
<p class="note">現在、サイトを準備中です。写真一覧・拡大表示・車両ごとの追加写真機能を順次作成します。</p>
</main>
<footer>鉄道・バス車両図鑑</footer>
</body>
</html>
